# N64Recomp config for Yoshi's Story (USA, En/Ja).
# See STATUS.md for how each part was derived.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
rom_file_path = "yoshisstory.us.z64"
symbols_file_path = "YoshiStorySyms/yoshisstory.us.syms.toml"

[patches]
stubs = []
ignored = []

# Overlays: tell the runtime where the game put each one. Overlay_Load
# (vromStart, vromEnd, vramStart, vramEnd, allocatedRamAddr) DMAs a
# relocatable overlay into RAM and relocates it. The recompiled code for that
# overlay reaches its own functions and data through the section's load
# address, so register it here, at the top of Overlay_Load, and drop
# whatever was registered in that RAM before (STATUS.md round 2).
[[patches.hook]]
func = "Overlay_Load"
before_vram = 0x8008169C
text = "unload_overlays((int32_t)MEM_W(0x10, ctx->r29), (uint32_t)(ctx->r7 - ctx->r6)); load_overlays((uint32_t)ctx->r4, (int32_t)MEM_W(0x10, ctx->r29), (uint32_t)(ctx->r5 - ctx->r4));"

# Frontend UI pump: recompui's queued per-frame UI callbacks run on the game
# thread. Hooked just before the game's only osViSwapBuffer call, in
# func_80071974 (the framebuffer swap loop), which runs once per presented
# frame. Both paths into 0x80071A18 pass through the hook. The pump may use
# a0-a2 and the stack (restored before it returns), so they're saved here;
# at this point only s-registers are live and a0 is set in the jal's delay
# slot.
[[patches.hook]]
func = "func_80071974"
before_vram = 0x80071A18
text = "{ gpr a0 = ctx->r4, a1 = ctx->r5, a2 = ctx->r6; recomp_run_ui_callbacks(rdram, ctx); ctx->r4 = a0; ctx->r5 = a1; ctx->r6 = a2; }"

# Loads into $zero (`lw $zero, off(reg)`): a read whose result is thrown
# away, which N64Recomp emits as the invalid C `0 = MEM_W(...)`. With no
# cache or bus side effects to preserve here, they become nops.
[[patches.instruction]]
func = "func_80071FF0"
vram = 0x80072040
value = 0x00000000

[[patches.instruction]]
func = "func_8007C1A0"
vram = 0x8007C2BC
value = 0x00000000

[[patches.instruction]]
func = "func_8007C1A0"
vram = 0x8007C2D0
value = 0x00000000

[[patches.instruction]]
func = "func_8007C1A0"
vram = 0x8007C2DC
value = 0x00000000

# Boot-state checks (STATUS.md round 3). The game reads several things only a
# real console leaves behind after boot and keeps a flag for each; a failed
# check quietly breaks the game later (e.g. func_800461F4's callback becomes
# a stub that returns 0). Each one is answered with what an original
# cartridge on real hardware gives:
#  - Idle_ThreadEntry reads the first words of SP IMEM and DMEM (0xA4001000,
#    0xA4000000), expected to be 0x17D8 and 0xFFFFFFFF. The two loads become
#    immediates.
#  - func_8005D420 and func_800687B8 read uncached RDRAM 0xA00002B8 and
#    0xA0000164 (left by the boot code), and func_800687B8 also checks
#    osCicId (0x80000310). Their `lui 0xA000` become `lui 0x8000` (the same
#    memory, cached) and the hook below seeds the three words.
#  - func_8006F500 reads two words of the cartridge's boot code directly
#    over the PI bus (ROM 0x458 and 0x45C, low halves). It's replaced by a
#    hook that stores the same result, 0x0260BCD5, which func_80064AD4
#    compares against.
# The same hook tells the crash handler where N64 memory is.
[[patches.hook]]
func = "Idle_ThreadEntry"
before_vram = 0x80067284
text = "dinotale_crash_note_rdram(rdram); MEM_W(0, (gpr)(int32_t)0x80000164) = 0x01EC6021; MEM_W(0, (gpr)(int32_t)0x800002B8) = 0x8941680C; MEM_W(0, (gpr)(int32_t)0x80000310) = 0x17D8;"

[[patches.instruction]]
func = "Idle_ThreadEntry"
vram = 0x80067334
value = 0x340917D8 # ori $t1, $zero, 0x17D8

[[patches.instruction]]
func = "Idle_ThreadEntry"
vram = 0x80067344
value = 0x240BFFFF # addiu $t3, $zero, -1

[[patches.instruction]]
func = "func_8005D420"
vram = 0x8005D444
value = 0x3C0E8000 # lui $t6, 0x8000

[[patches.instruction]]
func = "func_800687B8"
vram = 0x800687DC
value = 0x3C188000 # lui $t8, 0x8000

[[patches.hook]]
func = "func_8006F500"
before_vram = 0x8006F500
text = "MEM_W(0, (gpr)(int32_t)0x80108620) = 0x0260BCD5; return;"

# func_8000AD10 is the game's own copy of osAiSetNextBuffer(buf, size),
# writing the audio interface registers directly (with libultra's
# 8 KB-boundary workaround). It's handed to the runtime's osAiSetNextBuffer,
# which plays the buffer.
[[patches.hook]]
func = "func_8000AD10"
before_vram = 0x8000AD10
text = "osAiSetNextBuffer_recomp(rdram, ctx); return;"

# Uncached pointers. func_800035B4 and func_800035F8 allocate a buffer,
# invalidate its cache lines and return it as a KSEG1 (uncached) address,
# K0 + 0x20000000. The runtime only maps RDRAM at KSEG0, so the adds are
# removed and the buffers are used through their KSEG0 address, which is the
# same memory. Nothing in the game converts these pointers back.
[[patches.instruction]]
func = "func_800035B4"
vram = 0x800035E0
value = 0x00000000

[[patches.instruction]]
func = "func_800035F8"
vram = 0x80003624
value = 0x00000000

# True widescreen (Expand): a level's background layers are created with the
# view width from the level data (320). Widen it before func_8004EEEC
# allocates each layer's ring buffer and records the view size; the streamer,
# the camera window and the background draw all follow that size.
[[patches.hook]]
func = "func_8004F2B0"
before_vram = 0x8004F34C
text = "ctx->r4 = (gpr)(int32_t)dinotale_bg_view_width(rdram, (int32_t)ctx->r4);"

# True widescreen (Expand): the camera's horizontal wall probe uses half the
# view width (160.0, loaded with `lui $at, 0x4320`); use half the widened
# width instead, so the camera stops before the wider view passes a level's
# ends. (The vertical probe in func_8002A630 keeps 160.)
[[patches.hook]]
func = "func_8002A148"
before_vram = 0x8002A1AC
text = "ctx->r1 = (gpr)(int32_t)dinotale_camera_half_width_bits();"


# The background view func_8004EEEC just created (in $v0): clear its ring
# buffer; see src/game/widescreen.cpp.
[[patches.hook]]
func = "func_8004F2B0"
before_vram = 0x8004F354
text = "dinotale_bg_view_created(rdram, (uint32_t)ctx->r2);"

# A background layer being freed (the end of a level): Expand's view width is
# kept for the whole level, see src/game/widescreen.cpp.
[[patches.hook]]
func = "func_8004F38C"
before_vram = 0x8004F38C
text = "dinotale_bg_view_freed(rdram, (uint32_t)ctx->r4);"

# Expand: before a background layer is drawn, tell the renderer how much of
# it lies left of the layer's art (the wider view reaches past it at a level's
# start), to cover with black; see src/game/widescreen.cpp. Both draw paths:
# after streaming (func_8005F5D0: target in $s1, view object in $s0) and
# without (func_8005F690: target at sp+0x20, view object at sp+0x24).
[[patches.hook]]
func = "func_8005F5D0"
before_vram = 0x8005F658
text = "dinotale_bg_cover_outside(rdram, (uint32_t)ctx->r17, (uint32_t)ctx->r16);"

[[patches.hook]]
func = "func_8005F690"
before_vram = 0x8005F6DC
text = "dinotale_bg_cover_outside(rdram, (uint32_t)MEM_W(0x20, ctx->r29), (uint32_t)MEM_W(0x24, ctx->r29));"

# Expand: the fruit frame (30 slots around the screen edge) spread across the
# wider screen; see src/game/widescreen.cpp.
[[patches.hook]]
func = "func_80579F18"
before_vram = 0x80579F18
text = "dinotale_fruit_frame_begin(rdram, (uint32_t)ctx->r5);"

[[patches.hook]]
func = "func_80579F18"
before_vram = 0x8057A2B0
text = "dinotale_fruit_frame_end(rdram);"

# Expand: the health flower moves out to the left edge of the wider screen;
# see src/game/widescreen.cpp. At the end of func_8004733C (actor in $a2,
# screen x pointer at sp+0x18).
[[patches.hook]]
func = "func_8004733C"
before_vram = 0x80047418
text = "dinotale_hud_actor_screen_pos(rdram, ctx);"

# Expand: a background row request covers the level's column count (20, +1
# when the view isn't on a tile boundary), not the view's width, so rows
# streamed in as the camera moves vertically stopped short of the wider
# view's right side. Add the extra columns; see src/game/widescreen.cpp.
# func_8004FB98 stores the count ($t1) into the request at 0x8004FBF4.
[[patches.hook]]
func = "func_8004FB98"
before_vram = 0x8004FBF4
text = "ctx->r9 = dinotale_bg_row_columns(ctx->r9);"

# Expand: keeping Yoshi on screen. func_800233B4 checks his screen x against
# 16 and 304 (the 320-wide screen less 16 px) and past either calls
# func_80023310, which puts him back at the camera's centre -/+ 144. Move
# both out to the wider view's edges, or he jumps from the 4:3 edge to the
# wider one (and at a level's start off the level); at a level's start the
# left limit stays at the level's edge. See src/game/widescreen.cpp.
# The checks: `slti $at, <reg>, 0x130 / 0x10` at 0x800234DC ($t3),
# 0x80023534 ($t7), 0x8002358C ($t0) and 0x80023598 ($t1); actor in $a0.
[[patches.hook]]
func = "func_800233B4"
before_vram = 0x800234DC
text = "ctx->r11 = (gpr)dinotale_screen_right_test((int32_t)ctx->r11);"

[[patches.hook]]
func = "func_800233B4"
before_vram = 0x80023534
text = "ctx->r15 = (gpr)dinotale_screen_left_test(rdram, (uint32_t)ctx->r4, (int32_t)ctx->r15);"

[[patches.hook]]
func = "func_800233B4"
before_vram = 0x8002358C
text = "ctx->r8 = (gpr)dinotale_screen_right_test((int32_t)ctx->r8);"

[[patches.hook]]
func = "func_800233B4"
before_vram = 0x80023598
text = "ctx->r9 = (gpr)dinotale_screen_left_test(rdram, (uint32_t)ctx->r4, (int32_t)ctx->r9);"

# The spot func_80023310 puts him back at: the constants are loaded into $at
# by `lui` at 0x80023368 / 0x80023380 (actor in $a0).
[[patches.hook]]
func = "func_80023310"
before_vram = 0x8002336C
text = "ctx->r1 = dinotale_screen_margin_bits(rdram, (uint32_t)ctx->r4, -1);"

[[patches.hook]]
func = "func_80023310"
before_vram = 0x80023384
text = "ctx->r1 = dinotale_screen_margin_bits(rdram, (uint32_t)ctx->r4, 1);"

# Expand: actors' on-screen tests against the 320-wide screen. Each loads the
# actor's screen x (+0x34) and compares it with bounds at or past the screen's
# edges; pass it through dinotale_actor_screen_x so the bounds follow the
# wider view's edges. See src/game/widescreen.cpp.
# func_800591EC(x, y, margin_x, margin_y): the shared test, 1 if
# -margin_x < x < 320 + margin_x (the camera's width, +0x9C) and likewise for
# y; called with an actor's screen x from the "is it on screen" helpers
# (func_80059278, func_800592AC) and others. Bob-ombs and others despawn
# when it fails.
[[patches.hook]]
func = "func_800591EC"
before_vram = 0x800591EC
text = "ctx->r4 = (gpr)dinotale_actor_screen_x((int32_t)ctx->r4);"

# ovl_096 (5-4's Shy Guys on stilts): the stilts are drawn only while
# 0 <= x < 320 (`bltz $v0` / `slti $at, $v0, 0x140`).
[[patches.hook]]
func = "func_805175E4"
before_vram = 0x80517630
text = "ctx->r2 = (gpr)dinotale_actor_screen_x((int32_t)ctx->r2);"
